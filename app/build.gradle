plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.remotecontrol'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.remotecontrol"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // WebRTC (screen capture + streaming + data channel for taps)
    implementation 'io.github.webrtc-sdk:android:114.5735.08'

    // WebSocket client to talk to your signaling server (dashboard.render.com / ws)
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'

    // JSON
    implementation 'org.json:json:20231013'
}
